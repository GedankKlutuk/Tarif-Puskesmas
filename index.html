<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pencarian Tarif Puskesmas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F6F3EC;
    --paper:#FFFFFF;
    --ink:#1F2A22;
    --ink-soft:#5B6459;
    --teal:#2E5D4F;
    --teal-deep:#1D4137;
    --gold:#B9863A;
    --line:#E3DFD1;
    --line-soft:#EDEAE0;
    --tag-bg:#EAF0EC;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:820px;
    margin:0 auto;
    padding:40px 20px 80px;
  }
  header{
    padding-bottom:28px;
    border-bottom:1px solid var(--line);
    margin-bottom:28px;
  }
  .kop{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:2.1rem;
    line-height:1.15;
    margin:0 0 6px;
    letter-spacing:-0.01em;
  }
  .sub{
    color:var(--ink-soft);
    font-size:0.98rem;
    margin:0;
    max-width:46ch;
  }
  .legal{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.72rem;
    color:var(--teal-deep);
    background:var(--tag-bg);
    padding:4px 10px;
    border-radius:3px;
    white-space:nowrap;
  }

  .search-box{
    position:relative;
    margin-bottom:6px;
  }
  .search-box input{
    width:100%;
    font-family:'Fraunces', serif;
    font-size:1.35rem;
    font-weight:400;
    padding:14px 44px 14px 4px;
    border:none;
    border-bottom:2px solid var(--teal);
    background:transparent;
    color:var(--ink);
    outline:none;
  }
  .search-box input::placeholder{
    color:#9AA394;
    font-style:italic;
  }
  .search-box svg{
    position:absolute;
    right:6px;
    top:50%;
    transform:translateY(-50%);
    width:20px;
    height:20px;
    stroke:var(--ink-soft);
    pointer-events:none;
  }
  .clearbtn{
    position:absolute;
    right:6px;
    top:50%;
    transform:translateY(-50%);
    background:none;
    border:none;
    color:var(--ink-soft);
    font-size:1.1rem;
    cursor:pointer;
    display:none;
    padding:4px;
  }
  .search-box.has-text .clearbtn{display:block;}
  .search-box.has-text svg{display:none;}

  .meta-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:14px 0 22px;
    font-size:0.85rem;
    color:var(--ink-soft);
  }
  .meta-row span.count b{color:var(--teal-deep);}

  .chips{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:26px;
  }
  .chip{
    font-size:0.78rem;
    padding:5px 11px;
    border-radius:100px;
    border:1px solid var(--line);
    background:var(--paper);
    color:var(--ink-soft);
    cursor:pointer;
    transition:all .15s ease;
    font-family:'IBM Plex Sans',sans-serif;
  }
  .chip:hover{border-color:var(--teal);color:var(--teal-deep);}
  .chip.active{
    background:var(--teal-deep);
    border-color:var(--teal-deep);
    color:#fff;
  }

  .group{margin-bottom:8px;}
  .group-title{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.72rem;
    letter-spacing:0.02em;
    color:var(--gold);
    padding:22px 0 8px;
    border-bottom:1px solid var(--line-soft);
    margin-bottom:2px;
    display:flex;
    justify-content:space-between;
  }
  .group-title .n{color:#B8AF98;}

  .row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:16px;
    padding:13px 2px;
    border-bottom:1px solid var(--line-soft);
  }
  .row:last-child{border-bottom:none;}
  .row .name{
    font-size:0.98rem;
    line-height:1.4;
    color:var(--ink);
  }
  .row .name .sub-label{
    display:block;
    font-size:0.72rem;
    color:var(--ink-soft);
    margin-top:2px;
    font-style:italic;
  }
  .row .price{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.92rem;
    font-weight:500;
    color:var(--teal-deep);
    white-space:nowrap;
  }
  mark{
    background:#F3DFA8;
    color:inherit;
    padding:0 1px;
    border-radius:2px;
  }

  .empty{
    text-align:center;
    padding:60px 20px;
    color:var(--ink-soft);
  }
  .empty .big{
    font-family:'Fraunces', serif;
    font-size:1.3rem;
    color:var(--ink);
    margin-bottom:6px;
  }

  footer{
    margin-top:50px;
    padding-top:18px;
    border-top:1px solid var(--line);
    font-size:0.76rem;
    color:#9AA394;
    text-align:center;
  }

  @media (max-width:520px){
    h1{font-size:1.6rem;}
    .kop{flex-direction:column;align-items:flex-start;}
    .wrap{padding:26px 16px 60px;}
    .row .name{font-size:0.92rem;}
  }
</style>
</head>

<div class="wrap">
  <header>
    <div class="kop">
      <div>
        <h1>Tarif Layanan Puskesmas</h1>
        <p class="sub">Cari layanan dengan kata kunci untuk melihat tarif resminya.</p>
      </div>
      <span class="legal">Perda No. 02 Tahun 2025</span>

  </header>

    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
    <button class="clearbtn" id="clearBtn" aria-label="Hapus pencarian">✕</button>

  <div class="meta-row">

  <div class="chips" id="chips"></div>

  <div id="results"></div>
</div>

  const idx = text.toLowerCase().indexOf(query.toLowerCase());
  if(idx === -1) return text;
  return text.slice(0, idx) + '<mark>' + text.slice(idx, idx + query.length) + '</mark>' + text.slice(idx + query.length);
}

function renderResults(){
  const q = searchInput.value.trim().toLowerCase();
  searchBox.classList.toggle('has-text', q.length > 0);

  let filtered = DATA.filter(d => {
    const matchesQuery = !q || (d.layanan + ' ' + d.kategori + ' ' + d.subkategori).toLowerCase().includes(q);
    const matchesCat = !activeCategory || d.kategori === activeCategory;
    return matchesQuery && matchesCat;
  });

  resultCountEl.textContent = filtered.length;
  filterLabelEl.textContent = activeCategory ? 'Kategori: ' + activeCategory : '';

  resultsEl.innerHTML = '';

  if(filtered.length === 0){
    resultsEl.innerHTML = '<div class="empty"><div class="big">Layanan tidak ditemukan</div>Coba kata kunci lain, misalnya bagian dari nama layanan.</div>';
    return;
  }

  // group by kategori, preserve original order
  const groups = [];
  const groupIndex = {};
  filtered.forEach(item => {
    if(!(item.kategori in groupIndex)){
      groupIndex[item.kategori] = groups.length;
      groups.push({kategori: item.kategori, items: []});
    }
    groups[groupIndex[item.kategori]].items.push(item);
  });

  groups.forEach(g => {
    const groupDiv = document.createElement('div');
    groupDiv.className = 'group';

    const title = document.createElement('div');
    title.className = 'group-title';
    title.innerHTML = '<span>' + g.kategori.toUpperCase() + '</span><span class="n">' + g.items.length + '</span>';
    groupDiv.appendChild(title);

    g.items.forEach(item => {
      const row = document.createElement('div');
      row.className = 'row';
      const showSub = item.subkategori && item.subkategori.toUpperCase() !== item.kategori.toUpperCase() && !g.kategori.toUpperCase().includes(item.subkategori.toUpperCase());
      row.innerHTML =
        '<div class="name">' + highlight(item.layanan, q) +
          (showSub ? '<span class="sub-label">' + item.subkategori + '</span>' : '') +
        '</div>' +
        '<div class="price">' + fmt(item.tarif) + '</div>';
      groupDiv.appendChild(row);
    });

    resultsEl.appendChild(groupDiv);
  });
}

searchInput.addEventListener('input', renderResults);
clearBtn.addEventListener('click', () => {
  searchInput.value = '';
  searchInput.focus();
  renderResults();
});

renderChips();
renderResults();
</script>
</body>
</html>
